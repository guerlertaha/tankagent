name: Preise erfassen

on:
  schedule:
    # Alle 15 Minuten von 04:00 bis 23:59 UTC. Das deckt 06:00 bis 24:00 deutscher Zeit
    # in Sommer- und Winterzeit ab. Die genaue Ruhezeit prueft collector.py (QUIET_HOURS).
    # GitHub startet geplante Laeufe oft verspaetet.
    - cron: "7,22,37,52 4-23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Preis abfragen
        env:
          JITTER_MAX_S: "30"
          QUIET_HOURS: "0-6"
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DIESEL_ALERT_BELOW: ${{ vars.DIESEL_ALERT_BELOW }}
          NOTIFY_DIESEL_CHANGE: ${{ vars.NOTIFY_DIESEL_CHANGE }}
          PAGE_LINK: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python3 collector.py

      - name: Aenderung committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.csv 2>/dev/null || exit 0
          if git diff --cached --quiet; then
            echo "Nichts zu committen"
          else
            git commit -m "Preisupdate $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
